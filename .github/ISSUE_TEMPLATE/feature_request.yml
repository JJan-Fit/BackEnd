name: ✨ 기능 제안
description: 새 기능이나 개선 사항을 제안합니다.
title: "[Feat] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: domain
    attributes:
      label: 도메인
      options:
        - auth (로그인/인증)
        - exercises (운동)
        - incomes (수입)
        - expenses (지출)
        - weights (몸무게)
        - categories (카테고리)
        - core / config / infra
        - 기타
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 해결하고 싶은 문제 / 동기
      description: "왜" 이 기능이 필요한가요? 현재 어떤 불편이 있나요?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 어떤 동작/엔드포인트/스키마를 원하는지 가능한 한 구체적으로.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안
      description: 다른 방법은 없을지, 왜 제안한 안이 더 나은지.

  - type: textarea
    id: notes
    attributes:
      label: 추가 정보
      description: 참고 링크, 관련 이슈, 디자인 초안 등.
