name: 🐛 버그 리포트
description: 동작이 의도와 다른 경우 알려주세요.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        버그 신고 감사합니다. 재현 가능한 정보를 최대한 채워주세요.

  - type: dropdown
    id: domain
    attributes:
      label: 영향 도메인
      description: 어느 기능 영역에서 발생했나요?
      options:
        - auth (로그인/인증)
        - exercises (운동)
        - incomes (수입)
        - expenses (지출)
        - weights (몸무게)
        - categories (카테고리)
        - core / config / infra
        - 기타
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 한 줄로 무슨 일이 일어났는지.
      placeholder: 예) /exercises POST 요청이 500 으로 떨어진다.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 재현 단계
      description: 가능한 한 구체적으로. 요청 본문/쿼리/계정 상태 등.
      placeholder: |
        1. `uv run uvicorn app.main:app --reload` 실행
        2. 다음 요청을 보낸다: `curl -X POST ...`
        3. 응답이 500 으로 떨어짐
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작 / 에러 로그
      description: 스택트레이스/응답 본문이 있다면 코드블록으로.
      render: shell

  - type: input
    id: env
    attributes:
      label: 환경
      description: Python 버전, OS, 커밋 SHA 등.
      placeholder: Python 3.12.9 / macOS 25.0 / commit 99b6e78
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 추가 정보
      description: 스크린샷, 관련 PR/이슈, 시도해본 우회 방법 등 자유롭게.
